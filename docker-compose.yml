version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: monitoring_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: monitoring_pass
      POSTGRES_DB: monitoring_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d monitoring_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - monitoring_network

  redis:
    image: redis:7-alpine
    container_name: monitoring_redis
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - monitoring_network
    volumes:
      - redis_data:/data

  monitors-api:
    build:
      context: ./python-services/monitors
      dockerfile: Dockerfile
    container_name: monitoring_api
    environment:
      DATABASE_URL: postgresql://postgres:monitoring_pass@postgres:5432/monitoring_db
      PORT: 8000
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - monitoring_network
    restart: unless-stopped

  notifications-api:
    build:
      context: ./python-services/notifications
      dockerfile: Dockerfile
    container_name: notifications_api
    environment:
      DATABASE_URL: postgresql://postgres:monitoring_pass@postgres:5432/monitoring_db
      PORT: 8001
    ports:
      - "8001:8001"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - monitoring_network
    restart: unless-stopped

  scheduler:
    build:
      context: ./scheduler
      dockerfile: Dockerfile
    container_name: monitoring_scheduler
    environment:
      DATABASE_URL: postgresql://postgres:monitoring_pass@postgres:5432/monitoring_db
      REDIS_URL: redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - monitoring_network
    restart: unless-stopped

  checker:
    build:
      context: ./checker
      dockerfile: Dockerfile
    container_name: monitoring_checker
    environment:
      DATABASE_URL: postgresql://postgres:monitoring_pass@postgres:5432/monitoring_db
      REDIS_URL: redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - monitoring_network
    restart: unless-stopped

networks:
  monitoring_network:
    driver: bridge

volumes:
  postgres_data:
  redis_data: